services:
  clips:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CLIP_API_KEY: ${CLIP_API_KEY:?Définissez une clé privée dans .env}
      WHISPER_MODEL: small
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,https://chindu-clips-emery.savorysnail2048.chatgpt.site}
    volumes:
      - videos:/data
      - models:/home/clip/.cache
    restart: unless-stopped
volumes:
  videos:
  models:
